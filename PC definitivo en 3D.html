<style>

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;flex-direction:column}
#bar{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--bd);flex:none}
#bar button{flex:none;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:7px}
#bar button:hover{border-color:var(--ac)}
#bar button.on{border-color:var(--ac);background:#222a45}
#bar i{width:9px;height:9px;border-radius:50%;display:block}
#bar .sep{flex:none;width:1px;background:var(--bd);margin:0 4px}
#stage{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#panel{position:absolute;top:12px;right:12px;width:330px;max-height:calc(100% - 24px);overflow:auto;background:rgba(22,26,35,.94);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
#panel h2{margin:0 0 2px;font-size:19px;line-height:1.25}
#panel .cat{color:var(--mu);margin:0 0 12px;font-size:13px}
#panel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
#panel dt{color:var(--mu)}
#panel dd{margin:0}
#panel .why{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--bd)}
#panel .pr{margin:12px 0 0;font-size:17px;font-weight:600;color:var(--ac)}
#panel small{display:block;margin-top:10px;color:var(--mu);font-size:12px}
@media(max-width:700px){#panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:44%;padding:12px 14px}}
#app{flex:1;display:flex;min-height:0;min-width:0}
#bar{position:absolute;top:10px;left:10px;z-index:2;padding:0;border:0;overflow:visible;flex-wrap:wrap}
#panel{position:static;width:auto;max-height:none;overflow:visible;background:transparent;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:16px 18px}
#side{width:390px;flex:none;overflow:auto;background:var(--pn);border-left:1px solid var(--bd)}
.sec h3{margin:0;padding:10px 18px;font-size:13px;display:flex;justify-content:space-between;background:#1b2030;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.it{display:flex;gap:9px;align-items:center;padding:7px 18px;cursor:pointer}
.it:hover{background:#1d2330}.it.on{background:#222a45}
.it i{width:9px;height:9px;border-radius:50%;flex:none}.it .n{flex:1}
@media(max-width:700px){#app{flex-direction:column}#side{width:auto;height:48%;border-left:0;border-top:1px solid var(--bd)}#panel{padding:12px 16px}}
</style></head><body>
